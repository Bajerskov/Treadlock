[package]
name = "treadlock"
version = "0.1.0"
edition = "2021"

[dependencies]
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.29"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }
naga = { version = "23", features = ["wgsl-in", "spv-out"] }
libc = "0.2"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
# Optional so the game builds on a machine with no audio development headers,
# which is also how the mixer stays testable without a sound card.
cpal = { version = "0.18", optional = true }

[features]
default = ["audio"]
audio = ["dep:cpal"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
